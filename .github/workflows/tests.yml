name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false  # report both systems even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Poppler (pdftoppm): PDF page pictures (read_pdf); tests that need it skip without it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -v
